server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://product-service:8080  # <--- Changed from localhost
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: http://order-service:8082    # <--- Changed from localhost
              predicates:
                - Path=/api/orders/**
              filters:
                - JwtAuthenticationFilter   # <--- Apply the filter here
            - id: auth-service
              uri: http://auth-service:8083
              predicates:
                - Path=/api/auth/**
jwt:
  secret: mySuperSecretKeyForPetShopEcommerceApp12345

eureka:
  client:
    enabled: false
    register-with-eureka: false